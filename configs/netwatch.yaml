# Пример конфигурации netwatch.
# Значения совпадают с config.Default(); любой ключ можно убрать —
# тогда останется значение по умолчанию.

# Интерфейс для живого захвата (пусто — выбрать автоматически).
interface: ""
# Путь к pcap-файлу; если задан, интерфейс игнорируется.
file: ""
# Максимальный размер захватываемого пакета, в байтах.
snaplen: 65535
# Слушать весь трафик сегмента (promiscuous mode).
promiscuous: true
# BPF-фильтр в синтаксисе tcpdump, например "tcp port 443".
filter: ""
# Период перерисовки экрана.
refresh: 1s
# Число строк в каждом топе.
top_n: 10
# Через сколько забывать неактивный поток.
flow_ttl: 5m
# Не очищать экран и не использовать цвета (для pipe и логов).
no_clear: false

# Пороги и задержки детектора аномалий.
alerts:
  # Объём потока в мегабайтах, начиная с которого срабатывает событие.
  large_flow_mb: 50
  # Пауза между повторными событиями о больших потоках.
  large_flow_cooldown: 5m
  # Сколько разных портов за окно считается сканированием.
  port_scan_ports: 20
  # Окно, в котором считаются порты.
  port_scan_window: 10s
  # Пауза между повторными событиями сканирования.
  port_scan_cooldown: 1m
